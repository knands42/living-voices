[package]
name = "living-voices"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "living_voices"
path = "src/main.rs"

[lib]
name = "living_voices"
path = "src/lib.rs"


[dependencies]
slint = { version = "1.18.1", features = ["renderer-software"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0.21"
env_logger = { version = "0.11.10", features = ["auto-color", "humantime"] }
log = "0.4"
log-panics = "2.1"
toml = "1.1.6"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "sqlite",
  "macros",
  "migrate",
] }
tokio = {version = "1.53.1", features = ["macros", "rt-multi-thread"]}
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
base64 = "0.23.1"
async-trait = "0.1.92"
rand = "0.10.3"
ratatui = "0.30.2"
crossterm = "0.29.0"
color-eyre = "0.6.5"
# Graphics-protocol image widget. `chafa-dyn` disabled to avoid the system
# libchafa build dep; we keep `crossterm` + `image-defaults`. Pictures only
# render in terminals that support Kitty/iTerm2/Sixel; everywhere else we
# fall back to the GlyphAvatar in cli::draw::avatar.
ratatui-image = { version = "12.0.0-rc.3", default-features = false, features = ["crossterm", "image-defaults"] }

[build-dependencies]
slint-build = "1.18.1"
