[package]
name = "living-voices"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "living_voices"
path = "src/main.rs"

[lib]
name = "living_voices"
path = "src/lib.rs"


[dependencies]
iced = { version = "0.14", features = ["image"] }
futures-timer = "3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0.21"
env_logger = { version = "0.11.10", features = ["auto-color", "humantime"] }
log = "0.4"
log-panics = "2.1"
toml = "1.1.6"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "sqlite",
  "macros",
  "migrate",
] }
tokio = {version = "1.53.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "time"]}
tar = "0.4.46"
zstd = "0.13.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rand = "0.10.3"
ratatui = "0.30.2"
crossterm = "0.29.0"
ratatui-image = { version = "12.0.0-rc.3", default-features = false, features = ["crossterm", "image-defaults"] }

[profile.dev.package."*"]
opt-level = 2

