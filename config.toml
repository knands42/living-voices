# Living Voices settings.
#
# Paths are not configurable here. They follow the build profile:
#   debug   -> this project directory
#   release -> $HOME/projects/living-voice
#
# Every text endpoint speaks the OpenAI chat-completions API, so any
# OpenAI-compatible server (Ollama, llama.cpp, LM Studio) works unchanged.

[models.chat]
base_url = "http://localhost:11434/v1"
model = "llama3.1:8b"
temperature = 0.5
request_timeout_secs = 120

[models.memory]
base_url = "http://localhost:11434/v1"
model = "hf.co/sennaLLMLearner/qwen2.5-7b-memory-distiller:Q4_K_M"
# Distillation must stay faithful to the conversation, so keep this low.
temperature = 0.1
request_timeout_secs = 120

[models.image]
backend = "comfyui"
base_url = "http://localhost:8188"
workflow = "scene.json"

[memory]
# Distill once this many messages are uncovered by any summary.
compress_threshold = 80
# How many recent summaries / facts the prompt-context block carries.
summary_limit = 5
fact_limit = 5

[director]
# Chance (0.0–1.0) that a character you explicitly target answers directly.
targeted_pick_chance = 0.8
narrator_change_if_ooc = 0.2

[director.narrator_pick_chance_after_message_threshold_range]
min = 20
max = 30
