[models.chat]
enabled = true
base_url = "http://localhost:11434/v1"
model = "llama3.1:8b"
temperature = 0.5
request_timeout_secs = 120
keep_alive = "1h"

[models.memory]
enabled = true
base_url = "http://localhost:11434/v1"
model = "hf.co/sennaLLMLearner/qwen2.5-7b-memory-distiller:Q4_K_M"
temperature = 0.1
request_timeout_secs = 120
keep_alive = "0"

[models.image]
enabled = false
backend = "comfyui"
base_url = "http://localhost:8188"
workflow = "fluxq4"
reference_workflow = "fluxkontextq4"
output_dir = "comfyui/output"

[memory]
compress_after_threshold = 70
compress_last_messages = 50

[director]
targeted_pick_chance = 0.8
narrator_change_if_ooc = 0.2
act_max_messages = 200
follow_up_chance = 0.5
follow_up_max_chain = 6
narrator_min_gap = 10

[director.narrator_pick_chance_after_message_threshold_range]
min = 20
max = 30

[setup]
prompted_gate = false
